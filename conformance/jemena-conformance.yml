conformance_programme:
  operated_by_provider: true
  name: Jemena CSIP-AUS Approved Listing
  url: https://www.jemena.com.au/electricity/solar-and-other-technologies/jemena-approved-list-of-inverters/
  description: >-
    Jemena itself runs a conformance-testing and approval programme for its clients: staging
    connectivity, registration, discovery and functional tests must pass before a production
    certificate is issued, and from 1 July 2025 only inverters on Jemena's Approved Listing may
    connect and commission. Non-conforming applications are rejected.
