conclusion: >-
  Jemena is the clean negative control for the replicability question. Australia did transplant the exact
  statutory machinery that standardised its banks into energy, and it worked — 84 retailer brands sit in a
  live public register behind conformant base URIs. But the mandate was scoped to the retail relationship,
  so the party that owns the wires and sees every meter is outside it. What Jemena publishes instead was
  produced by a completely different Victorian instrument aimed at grid stability, and that instrument
  delivered a genuinely live, standards-conformant, verifiable API — CSIP-AUS over IEEE 2030.5 — that no
  consumer or third-party developer can use. Two mandates, two real implementations, zero open data. The
  lesson is that mandates are replicable but they replicate exactly what they were scoped to, and scope is
  where the value goes.
