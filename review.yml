artifacts:
  openapiHarvested: false
  specsCount: 0
  note: >-
    No machine-readable API description of any kind is published by Jemena. The Utility Server contract
    exists only as PDF prose over externally-maintained IEEE 2030.5 / CSIP-AUS XML schemas. Nothing was
    fabricated or derived into openapi/; the operation list above is a verbatim harvest of the paths
    printed in Jemena's own public handbook, recorded here rather than dressed up as a specification.

