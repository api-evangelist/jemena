enrichment:
  date: '2026-07-27'
  note: >-
    Round 2 enrichment. Contract discovery was re-run against every host — www.jemena.com.au,
    api.jemena.com.au, myportal, myservices and the Utility Server itself on port 8443 — for
    /openapi.json, /swagger.json, /api-docs, /docs, GraphQL and MCP. All negative; the mTLS gate
    returns HTTP 500 for every anonymous path. Jemena genuinely publishes no machine-readable API
    description, so nothing was fabricated into openapi/. The artifacts in this repo are instead a
    faithful harvest of the prose contract in Jemena's own public JEN OEM Technical Guide Handbook
    v1.0 (authentication, conventions, errors, sandbox, conformance, lifecycle) plus a derived entity
    graph. No WellKnown, Webhooks, AsyncAPI, SDKs, MCPServer, AgentSkill, Idempotency, Compliance,
    Deprecation, Roadmap or Postman pointer is claimed, because none of those things exists here.
specificationVersion: '0.23'
apis:
- aid: jemena:jemena-csip-aus-utility-server
  name: Jemena CSIP-AUS Utility Server (IEEE 2030.5)
  description: >-
    Jemena Electricity Networks' CSIP-AUS compliant control server — an IEEE 2030.5 (Smart Energy Profile 2.0)
    implementation of the Common Smart Inverter Profile Australia (SA TS 5573) — used to discover, monitor and
    remotely curtail small and medium embedded generation (rooftop solar, batteries, VPP fleets) on the Jemena
    Victorian distribution network under the Victorian Government's emergency backstop mandate. Clients connect
    either as an aggregator/cloud gateway or as a direct-connected device. The XML resource tree is documented
    publicly in Jemena's OEM technical guide handbook: device capability (/sep2/dcap), time (/sep2/tm), end
    device list (/sep2/edev), function set assignments (/sep2/fsagrp/{id}/fsa), DER programs and controls
    (/sep2/grp/{id}/derp, /sep2/derp/{id}/dderc, /sep2/derp/{id}/derc), DER status/capability/settings/availability
    (PUT /sep2/der/{id}/ders, /dercap, /derg, /dera), and mirror usage points and meter readings (/sep2/mup,
    /sep2/upt/{id}/mr/{id}). Access is not self-serve — an OEM or aggregator must submit a Certificate Signing
    Request and IP addresses to whitelist, receive a Jemena-signed IEEE 2030.5 PKI client certificate, pass
    connectivity, discovery and functional tests in the staging environment, then be onboarded to production and
    added to Jemena's CSIP-AUS Approved Listing. Verified live on 2026-07-27: the documented production host
    resolves to an AWS ap-southeast-2 load balancer and GET /sep2/dcap returns HTTP 500 from nginx when called
    without a client certificate, consistent with a mutually-authenticated TLS endpoint.
  humanURL: https://www.jemena.com.au/electricity/solar-connections/victoria-emergency-backstop-mechanism/emergency-backstop-mechanism-documents/
  baseURL: https://sep2.aws.jemena.com.au:8443/sep2
