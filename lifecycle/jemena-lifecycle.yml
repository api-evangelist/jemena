deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    Jemena publishes no API deprecation policy, no Sunset/Deprecation header support (RFC 8594) and no
    breaking-change notice period. The nearest analogues are regulatory and connection-policy events,
    recorded below, not API lifecycle guarantees. No `Deprecation` pointer is claimed.
  related_events:
  - date: '2025-07-01'
    kind: connection-policy
    description: >-
      From 1 July 2025 only inverters on Jemena's CSIP-AUS Approved Listing may connect and commission;
      non-conforming applications are rejected.
    url: https://www.jemena.com.au/electricity/solar-and-other-technologies/jemena-approved-list-of-inverters/
  - date: '2025-10-09'
    kind: regulatory
    description: >-
      Victoria Government Gazette GG2025S553 Order in Council made, revoking the earlier GG2024S031 and
      GG2024S336 Orders that had established the emergency backstop obligation.
  - kind: decommissioned-service
    description: >-
      electricityoutlook.jemena.com.au — the former customer smart-meter portal — returns NXDOMAIN from
      a public resolver as of 2026-07-27 despite still being widely linked and indexed. Retired without
      a published deprecation notice; third-party clients built against it (e.g. community
      Home Assistant integrations) are dead.
    status: removed
